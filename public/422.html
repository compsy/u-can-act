<!DOCTYPE html>
<html lang="en">
<head>
  <title>The change you wanted was rejected (422)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  .rails-default-error-page {
    background-color: #EFEFEF;
    color: #2E2F30;
    text-align: center;
    font-family: arial, sans-serif;
    margin: 0;
  }

  .rails-default-error-page div.dialog {
    width: 95%;
    max-width: 33em;
    margin: 4em auto 0;
  }

  .rails-default-error-page div.dialog > div {
    border: 1px solid #CCC;
    border-right-color: #999;
    border-left-color: #999;
    border-bottom-color: #BBB;
    border-top: #B00100 solid 4px;
    border-top-left-radius: 9px;
    border-top-right-radius: 9px;
    background-color: white;
    padding: 7px 12% 0;
    box-shadow: 0 3px 8px rgba(50, 50, 50, 0.17);
  }

  .rails-default-error-page h1 {
    font-size: 100%;
    color: #730E15;
    line-height: 1.5em;
  }

  .rails-default-error-page div.dialog > p {
    margin: 0 0 1em;
    padding: 1em;
    background-color: #F7F7F7;
    border: 1px solid #CCC;
    border-right-color: #999;
    border-left-color: #999;
    border-bottom-color: #999;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
    border-top-color: #DADADA;
    color: #666;
    box-shadow: 0 3px 8px rgba(50, 50, 50, 0.17);
  }
  </style>
</head>

<body class="rails-default-error-page">
  <!-- This file lives in public/422.html -->
  <div class="dialog">
    <div>
      <h1 data-i18n="title">The change you wanted was rejected.</h1>
      <p data-i18n="detail">Maybe you tried to change something you didn't have access to.</p>
    </div>
    <p data-i18n="owner">If you are the application owner check the logs for more information.</p>
  </div>
<script>
  // Static page, so pick the text from the browser languages. Without JavaScript the text above is shown.
  (function () {
    var texts = {
      nl: {"title": "De wijziging die je wilde doen is geweigerd.", "detail": "Misschien probeerde je iets te wijzigen waar je geen toegang toe hebt.", "owner": "Ben je de beheerder van deze applicatie, bekijk dan de logs voor meer informatie."},
      en: {"title": "The change you wanted was rejected.", "detail": "Maybe you tried to change something you didn't have access to.", "owner": "If you are the application owner check the logs for more information."},
      fi: {"title": "Haluamasi muutos hylättiin.", "detail": "Ehkä yritit muuttaa jotain, johon sinulla ei ole pääsyä.", "owner": "Jos olet sovelluksen ylläpitäjä, katso lisätietoja lokeista."},
      de: {"title": "Die gewünschte Änderung wurde abgelehnt.", "detail": "Möglicherweise haben Sie versucht, etwas zu ändern, worauf Sie keinen Zugriff haben.", "owner": "Wenn Sie der Betreiber dieser Anwendung sind, finden Sie weitere Informationen in den Logs."},
      es: {"title": "El cambio que quería hacer ha sido rechazado.", "detail": "Quizás intentó cambiar algo a lo que no tiene acceso.", "owner": "Si es el responsable de la aplicación, consulte los registros para obtener más información."},
      pt: {"title": "A alteração que pretendia foi rejeitada.", "detail": "Talvez tenha tentado alterar algo a que não tem acesso.", "owner": "Se é o responsável pela aplicação, consulte os registos para obter mais informações."}
    };
    var languages = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < languages.length; i++) {
      var lang = (languages[i] || '').split('-')[0].toLowerCase();
      if (!texts[lang]) continue;
      document.documentElement.lang = lang;
      var elements = document.querySelectorAll('[data-i18n]');
      for (var j = 0; j < elements.length; j++) elements[j].textContent = texts[lang][elements[j].getAttribute('data-i18n')];
      return;
    }
  })();
</script>
</body>
</html>
